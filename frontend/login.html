<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Área do Barbeiro</title>
    
    <meta name="description" content="Acesso restrito ao painel administrativo da Barbearia. Gerencie sua agenda e clientes no ClientFlow." />

    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" /></noscript>

    
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="body-login">

    <main class="login-container">
        <div class="login-box">
            <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar ao site</a>

            <h2>Área do Barbeiro</h2>
            <p>Acesse o painel</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Digite seu e-mail" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fas fa-eye" id="toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-principal btn-block">Entrar no Painel</button>

                <div id="mensagem-erro" class="error-message"></div>
            </form>

            <p class="esqueceu-senha">
                <a href="#" id="btn-recuperar-senha">Esqueceu a senha?</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/auth.js" defer></script>
</body>

</html>
