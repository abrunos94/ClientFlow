<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesso restrito ao painel administrativo da Barbearia." />
    <title>Login | Área do Barbeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/login.css">
</head>

<body class="body-login">

    <main class="login-container">
        <section class="login-box">
            <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar ao site</a>

            <h2>Área do Barbeiro</h2>
            <p>Acesse o painel </p>

            <form id="form-login" autocomplete="on" novalidate>
                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input type="email" id="usuario" name="usuario" inputmode="email" autocomplete="username"
                        spellcheck="false" autocapitalize="none" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" placeholder="••••••••" required
                            autocomplete="current-password">
                        <i class="fas fa-eye" id="toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-principal btn-block">Entrar no Painel</button>

                <div id="mensagem-erro" class="error-message" aria-live="polite"></div>
            </form>

            <p class="esqueceu-senha">
                <a href="#" id="btn-recuperar-senha">Esqueceu a senha?</a>
            </p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/auth.js" defer></script>
</body>

</html>
